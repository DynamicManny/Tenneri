<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tenneri PlacetoPay Sandbox Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #181b21;
    border: 1px solid #2a2e37;
    border-radius: 10px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: #9aa0ab;
    font-size: 14px;
    margin-top: 0;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #c4c9d2;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #353a45;
    background: #0f1115;
    color: #f2f2f2;
    font-size: 14px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    border-radius: 6px;
    border: none;
    background: #4f6df5;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: #353a45;
    cursor: not-allowed;
  }
  .error {
    margin-top: 16px;
    color: #ff6b6b;
    font-size: 13px;
    display: none;
  }
  .badge {
    display: inline-block;
    background: #2a2e37;
    color: #9aa0ab;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 100px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="badge">SANDBOX DEMO &mdash; TENNERI</div>
  <h1>PlacetoPay Integration Test</h1>
  <p class="subtitle">This page creates a real PlacetoPay sandbox session to demonstrate the full checkout flow end to end.</p>

  <label for="name">Full Name</label>
  <input type="text" id="name" value="Test Buyer">

  <label for="email">Email</label>
  <input type="email" id="email" value="test@example.com">

  <label for="amount">Amount (USD)</label>
  <input type="number" id="amount" value="10.00" step="0.01">

  <button id="payBtn">Pay with PlacetoPay (Sandbox)</button>

  <div class="error" id="errorBox"></div>
</div>

<script>
// --- CONFIG: sandbox credentials for demo purposes only ---
const P2P_LOGIN = "4c7f04dfe96f606f392eafe976bb3e34";
const P2P_SECRET_KEY = "V1AlO65pom2yA4l5";
const P2P_ENDPOINT = "https://checkout-test.placetopay.com/api/session";

// Builds the auth block per PlacetoPay's WS-Security UsernameToken spec.
async function buildAuth(login, secretKey) {
  const seed = new Date().toISOString();
  const rawNonce = crypto.getRandomValues(new Uint8Array(16));
  const rawNonceStr = Array.from(rawNonce).map(b => String.fromCharCode(b)).join("");

  const encoder = new TextEncoder();
  const data = encoder.encode(rawNonceStr + seed + secretKey);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const tranKey = btoa(String.fromCharCode(...hashArray));
  const nonce = btoa(rawNonceStr);

  return { login, tranKey, nonce, seed };
}

document.getElementById("payBtn").addEventListener("click", async () => {
  const btn = document.getElementById("payBtn");
  const errorBox = document.getElementById("errorBox");
  errorBox.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Creating session...";

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const amount = parseFloat(document.getElementById("amount").value);

  try {
    const auth = await buildAuth(P2P_LOGIN, P2P_SECRET_KEY);
    const returnBase = window.location.href.replace("p2p-demo.html", "p2p-return.html");

    const payload = {
      locale: "en_US",
      auth,
      payment: {
        reference: "TENNERI-DEMO-" + Date.now(),
        description: "Tenneri PlacetoPay sandbox demo",
        amount: {
          currency: "USD",
          total: amount
        }
      },
      buyer: {
        name: name,
        email: email
      },
      expiration: new Date(Date.now() + 60 * 60 * 1000).toISOString(),
      returnUrl: returnBase,
      cancelUrl: returnBase
    };

    const response = await fetch(P2P_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    const statusCode = data && data.status ? data.status.status : null;
    const processUrl = data ? data.processUrl : null;

    if (statusCode !== "OK" || !processUrl) {
      const reason = (data && data.status && data.status.message) || "Unknown error creating session";
      throw new Error(reason);
    }

    window.location.href = processUrl;

  } catch (err) {
    errorBox.textContent = "Error: " + err.message;
    errorBox.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Pay with PlacetoPay (Sandbox)";
  }
});
</script>

</body>
</html>
